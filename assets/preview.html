<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tower Defense // Asset Previewer</title>
	<link rel="stylesheet" href="/styles/assets-internal.css">
	<link rel="shortcut icon" type="image/png" id="favicon">
	<style>

		html, body {
			scroll-behavior: smooth;
		}

		div:has(>#sources) {
			position: sticky;
			top: 0px;
			height: calc( 100vh - 32px );
		}
		#sources li {
			width: max-content;
			max-width: 20vw;
			overflow: hidden;
			text-overflow: ellipsis;
			text-wrap: nowrap;
			margin-bottom: 8px;
		}

		#sprites > section {
			border: none;
			border-top: 1px solid black;
			padding: 0;
			background: none;
			width: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		#sprites > section div {
			border: none;
			padding: 0;
			background: none;
			display: flex;
			flex-direction: row;
			flex-wrap: wrap;
			gap: 16px;
		}

		#sprites > section div section {
			width: max-content;
			align-items: center;
		}

		#sprites > section div canvas {
			width: min-content;
		}

		a {
			color: black;
			text-decoration: none;
		}

		a::before {
			content: ""
		}

		@keyframes highlight {
			from, to {
				background: none;
				scale: 1;
			}
			25%, 75% {
				scale: 0.99;
			}
			50% {
				background: color-mix(in srgb, blue 20%, transparent);
				font-weight: 900;
				scale: 1.1;
			}
		}

	</style>
</head>
<body>
	
	<template id="sprite">
		<section class="sprite">
			<canvas id="result"></canvas>
			<p id="name"></p>
		</section>
	</template>

	<div id="content">
		<div>
			<h1>Loaded JSON files:</h1>
			<ul id="sources"></ul>
		</div>

		<div>
			<h1><code>SpriteData</code> Objects:</h1>
			<div id="sprites"></div>
		</div>
	</div>

	<a href="./exporter.html" class="button" style="position: fixed; bottom: 16px; left: 16px; z-index: 100">Create sprite</a>

	<script type="module" src="../dist/assets/preview.js"></script>
	<script src="../dist/favicon.js"></script>

</body>
</html>
