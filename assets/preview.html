<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tower Defense // Asset Previewer</title>
	<link rel="stylesheet" href="/styles/assets-internal.css">
	<style>
		section {
			width: max-content;
			align-items: center;
		}
		section canvas {
			width: fit-content;
		}
	</style>
</head>
<body>
	
	<template id="sprite">
		<section class="sprite">
			<canvas id="result"></canvas>
			<p id="name"></p>
		</section>
	</template>

	<div id="content">
		<div>
			<h1>Loaded JSON files:</h1>
			<ul id="sources"></ul>
		</div>

		<div>
			<h1><code>SpriteData</code> Objects:</h1>
			<div id="sprites"></div>
		</div>
	</div>

	<a href="./exporter.html" class="button" style="position: fixed; bottom: 16px; left: 16px; z-index: 100">Create sprite</a>

	<script type="module" src="../dist/assets/preview.js"></script>

</body>
</html>
