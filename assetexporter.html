<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tower Defense // Asset Exporter</title>
	<style>

		body {
			margin: 0px;
			padding: 8px;
			font-family: monospace;
			background: whitesmoke;
		}

		nav {
			position: sticky;
			top: 0px;
			left: 0px;
			display: flex;
			flex-direction: row;
			gap: 16px;
			justify-content: center;
			background-color: whitesmoke;
			margin-bottom: 8px;
			padding: 8px;
			z-index: 3148244321913097;
		}

		#sprites {
			display: flex;
			flex-direction: row;
			justify-content: center;
			gap: 24px;
			flex-wrap: wrap;
			max-width: 100%;
			padding: 0 5%;
		}
		section {
			background: white;
			display: flex;
			flex-direction: column;
			width: min-content;
			width: 450px;
			gap: 16px;
			border: 1px solid black;
			padding: 16px;
		}
		canvas {
			border: 1px dashed black;
			max-width: 500px;
		}
		output {
			border: 1px dashed black;
			display: block;
			white-space: pre;
			font-family: monospace;
			max-height: 200px;
			overflow: scroll;
			padding: 16px;
		}

		div.divider {
			display: block;
			height: 1px;
			background: black;
		}

		button, input {
			font: inherit;
			color: inherit;
		}

		button {
			background: black;
			color: white;
			border-radius: 0px;
			border: none;
			padding: 8px 16px;
			cursor: pointer;
		}

		button:disabled {
			background: #808080;
			cursor: not-allowed;
			background-image: url("./assets/diagonal-fill.svg");
			background-size: 8px 8px;
		}

	</style>
</head>
<body>

	<nav>
		<button id="new-sprite">Create sprite</button>
		<button id="export-all" disabled>Export All</button>
	</nav>

	<template id="sprite-template">
		<section>
			<div>
				<p>
					<label for="sprite-name">Sprite Name:</label>
					<input type="text" placeholder="untitled-sprite" id="sprite-name">
				</p>
				<p>
					<label for="sprite-source">Source Image:</label>
					<input type="file" accept="image/png image/gif" id="sprite-source">
				</p>
			</div>
			<div class="divider"></div>
			<canvas role="source"></canvas>
			<button disabled>Export Source Image</button>
			<div class="divider"></div>
			<output role="json"></output>
			<button disabled>Export JSON Data</button>
		</section>
	</template>

	<div id="sprites"></div>

	<script type="module" src="./dist/assetexporter/index.js"></script>
	<script>
		const nav = document.querySelector("nav");

		document.addEventListener("scroll", () => {
			if (window.scrollY >= 8) nav.style.borderBottom = "1px solid black";
			else nav.style.borderBottom = "";
		});
	</script>
</body>
</html>
