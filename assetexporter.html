<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>

		body {
			margin: 0px;
			padding: 8px;
		}

		nav {
			position: sticky;
			top: 0px;
			left: 0px;
			display: flex;
			flex-direction: row;
			gap: 16px;
			justify-content: center;
			background-color: white;
			margin-bottom: 8px;
			padding: 8px;
		}

		#sprites {
			display: flex;
			flex-direction: row;
			justify-content: center;
			gap: 24px;
			flex-wrap: wrap;
			max-width: 100%;
			padding: 0 5%;
		}
		section {
			display: flex;
			flex-direction: column;
			width: min-content;
			max-width: 750px;
			gap: 16px;
			border: 1px solid black;
			padding: 16px;
		}
		canvas {
			border: 1px dashed black;
			max-width: 500px;
		}
		output {
			border: 1px dashed black;
			display: block;
			white-space: pre;
			font-family: monospace;
			max-height: 200px;
			overflow: scroll;
			padding: 16px;
		}

		div.divider {
			display: block;
			height: 1px;
			background: black;
		}

		button {
			background: black;
			color: white;
			border-radius: 0px;
			border: none;
			padding: 8px 16px;
			cursor: pointer;
		}

		button:disabled {
			background: gray;
			cursor: disabled;
		}
	</style>
</head>
<body>

	<nav>
		<button id="new-sprite">Create sprite</button>
		<button id="export-all" disabled>Export All</button>
	</nav>

	<div id="sprites"></div>

	<script type="module" src="./dist/assetexporter/index.js"></script>
</body>
</html>
